[project]
name = "daswork-litellm-gateway"
version = "0.1.0"
description = "Single-process Daswork gateway for LiteLLM Responses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.2",
    "httpx==0.28.1",
    "daswork-litellm-oss==1.109.1",
    "psycopg[binary,pool]==3.2.12",
    "pyyaml==6.0.3",
    "redis==6.4.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "basedpyright==1.39.7",
    "hatchling==1.27.0",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.15.3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[tool.uv.sources]
daswork-litellm-oss = { path = "../packaging/daswork-core", editable = true }

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [".."]
only-include = ["."]
exclude = ["/tests", "/Dockerfile", "/AGENTS.md", "/uv.lock", "/pyproject.toml"]

[tool.hatch.build.targets.wheel.sources]
"." = "daswork_enterprise"
