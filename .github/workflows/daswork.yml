name: Daswork gateway
on: [push, pull_request]
jobs:
  gateway:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:7.4.8
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DASWORK_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DASWORK_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.9
      - run: uv sync --project daswork_enterprise --locked
      - run: make check-daswork
      - run: uv run --project daswork_enterprise --frozen pytest daswork_enterprise/tests
      - run: docker build -f daswork_enterprise/Dockerfile .
