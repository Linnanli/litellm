[project]
name = "daswork-litellm-oss"
version = "1.109.1"
description = "LiteLLM OSS Python Responses runtime from the reviewed source snapshot"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "aiohttp>=3.13.3,<4",
    "anyio>=4.12,<5",
    "boto3>=1.42,<2",
    "certifi>=2026.1.4",
    "click>=8.1.8,<9",
    "fastuuid>=0.14,<1",
    "filelock>=3.16.1,<5",
    "httpx[http2]>=0.28.1,<1",
    "huggingface-hub>=0.34,<2",
    "importlib-metadata>=8,<9",
    "jinja2>=3.1.6,<4",
    "jsonschema>=4.23,<5",
    "openai>=2.20,<4",
    "packaging>=24",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "tiktoken>=0.8,<1",
    "tokenizers>=0.21,<1",
    "typing-extensions>=4.13,<5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["../.."]
only-include = ["pyproject.toml"]

[tool.hatch.build.targets.wheel.force-include]
"../../litellm" = "litellm"
"../../LICENSE" = "daswork_litellm_licenses/LICENSE"
"../../LICENSES" = "daswork_litellm_licenses/LICENSES"
